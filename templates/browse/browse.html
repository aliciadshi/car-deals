<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Work+Sans:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/browse-static/browse.css">
</head>
<body>
    <div class="browse">
        <aside class="filters" aria-label="Filters">
            <h2>Filters</h2>
            <form id="filter-form">
                <label class="field">
                    <span>Zip Code</span>
                    <input type="text" name="zip" value="95121" autocomplete="postal-code">
                </label>
                <label class="field">
                    <span>Radius</span>
                    <input type="text" name="radius" value="50 mi">
                </label>
                <label class="field">
                    <span>Price range</span>
                    <input type="text" name="price" value="$5,000 – $45,000">
                </label>
                <label class="field">
                    <span>Make</span>
                    <input type="text" name="make" value="Any make">
                </label>
                <label class="field">
                    <span>Model</span>
                    <input type="text" name="model" value="Any model">
                </label>
                <label class="field">
                    <span>Year</span>
                    <input type="text" name="year" value="2001 – 2026">
                </label>
                <label class="field">
                    <span>Max mileage</span>
                    <input type="text" name="mileage" value="Up to 150,000 mi">
                </label>
                <button type="submit" class="apply">Apply filters</button>
                <button type="button" id="reset-filters" class="reset">Reset filters</button>
            </form>
        </aside>

        <main class="results">
            <h1>Browse cars</h1>
            <div class="listings" id="listings">
                <div class="listings-head" role="row">
                    <span>Year</span>
                    <span>Make</span>
                    <span>Model</span>
                    <span>Price</span>
                    <span>Mileage</span>
                    <span>Location</span>
                </div>
            </div>
            <p id="empty-state" class="empty-state" hidden>No cars match these filters.</p>
        </main>
    </div>
    <script src="/browse-static/browse.js" defer></script>
</body>
</html>
